# Pipeline Configuration - Development Environment

pipeline:
  name: "daily_etl"
  description: "Daily ETL pipeline for user events"
  schedule: "0 2 * * *"  # Daily at 2 AM UTC
  timezone: "UTC"
  
  # Retry configuration
  retries: 3
  retry_delay_minutes: 5
  timeout_hours: 4

source:
  type: "jdbc"
  url: "jdbc:postgresql://localhost:5432/source_db"
  table: "raw_events"
  user: "${SOURCE_DB_USER}"
  password: "${SOURCE_DB_PASSWORD}"
  driver: "org.postgresql.Driver"
  # Partitioning for large tables
  partition_column: "event_id"
  lower_bound: 1
  upper_bound: 1000000
  num_partitions: 10

transformations:
  - type: "filter"
    condition: "event_timestamp >= current_date - interval 1 day"
  
  - type: "with_column"
    name: "event_date"
    expression: "to_date(event_timestamp)"
  
  - type: "with_column"
    name: "processing_timestamp"
    expression: "current_timestamp()"
  
  - type: "with_column"
    name: "pipeline_run_id"
    expression: "uuid()"
  
  - type: "deduplicate"
    subset: ["event_id"]
  
  - type: "select"
    columns:
      - "event_id"
      - "user_id"
      - "event_type"
      - "event_timestamp"
      - "event_date"
      - "properties"
      - "processing_timestamp"
      - "pipeline_run_id"

sink:
  type: "delta"
  path: "s3a://data-lake-dev/processed/events/daily"
  mode: "overwrite"
  # Partitioning for query performance
  partition_by: ["event_date"]
  # Delta Lake optimizations
  options:
    "delta.autoOptimize.optimizeWrite": "true"
    "delta.autoOptimize.autoCompact": "true"

# Data quality checks
quality_checks:
  - name: "non_null_event_id"
    type: "not_null"
    column: "event_id"
    threshold: 1.0  # 100% non-null
  
  - name: "valid_event_types"
    type: "values_in_set"
    column: "event_type"
    allowed_values: ["page_view", "click", "purchase", "signup", "login"]
    threshold: 0.99
  
  - name: "event_date_not_future"
    type: "custom_sql"
    condition: "event_date <= current_date"
    threshold: 1.0
  
  - name: "row_count_threshold"
    type: "row_count"
    min_rows: 1000
    max_rows: 10000000

# Monitoring
monitoring:
  metrics:
    - "input_row_count"
    - "output_row_count"
    - "processing_time_seconds"
    - "data_quality_score"
  alerts:
    - condition: "data_quality_score < 0.95"
      severity: "critical"
      channels: ["pagerduty", "slack"]
    - condition: "processing_time_seconds > 7200"
      severity: "warning"
      channels: ["slack"]

# Resource allocation
resources:
  driver_memory: "4g"
  executor_memory: "8g"
  executor_cores: 4
  num_executors: 10
  dynamic_allocation: true
  min_executors: 5
  max_executors: 20